# Documentation site: `pip install -r docs/requirements.txt -e .`, then
# `mkdocs serve` (preview) or `mkdocs build`. Guides, examples, the list of
# rcif categories and the API reference are generated by docs/hooks.py from
# the package itself, so they follow the code.
site_name: CrysPy
site_description: Crystallographic library for polarized and unpolarized neutron diffraction data analysis
site_url: https://ikibalin.github.io/cryspy/
repo_url: https://github.com/ikibalin/cryspy
repo_name: ikibalin/cryspy
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2018-2026 Iurii Kibalin, MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: false
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
