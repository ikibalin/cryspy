[project]
name = 'cryspy'
dynamic = ['version']
description = 'PNPD data analysis'
readme = 'README.md'
license = 'MIT'
authors = [{ name = 'Iurii Kibalin', email = 'yurikibalin@outlook.com' }]
keywords = ['Polarized Neutron Diffraction Data Analysis']
requires-python = '>=3.10'
classifiers = [
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
]
# Lower bounds: the bundled database (A_functions_base/database.pickle)
# is pickled with numpy 2 and does not load with numpy 1.x; scipy and
# matplotlib are the first versions built for numpy 2.
# Visualization is optional: `pip install cryspy[plot]` adds matplotlib for
# the plot_* methods, `pip install cryspy[all]` installs every extra.
dependencies = [
  'numpy>=2.0',
  'scipy>=1.13',
  'pycifstar',
]

[project.optional-dependencies]
plot = ['matplotlib>=3.9']
all = ['cryspy[plot]']
dev = [
  'cryspy[all]',  # Tests cover the plots
  'pytest',       # Testing
  'pytest-xdist', # Parallel test execution
  'pytest-cov',   # Test coverage
  'build',        # Building the package
  'versioningit', # Automatic versioning from git tags
]

[project.urls]
Homepage = 'https://github.com/ikibalin/cryspy'
'Source Code' = 'https://github.com/ikibalin/cryspy'
'Issue Tracker' = 'https://github.com/ikibalin/cryspy/issues'

[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling', 'versioningit']

[tool.hatch.version]
source = 'versioningit'

[tool.hatch.build.targets.wheel]
packages = ['cryspy']

[tool.hatch.build.targets.sdist]
include = ['cryspy', 'README.md']

# Versioningit derives the version from git tags, so it does not need to
# be stored in the source. cryspy tags are plain (e.g. 0.11.0).
[tool.versioningit.vcs]
method = 'git'
default-tag = '0.11.0'

[tool.versioningit.format]
distance = '{base_version}+dev{distance}'
dirty = '{base_version}+dirty{distance}'
distance-dirty = '{base_version}+devdirty{distance}'

# Linting (roadmap Phase 5a): pyflakes rules and bare `except:` first,
# more rule sets later. Run `ruff check .` or `pre-commit run --all-files`.
[tool.ruff]
extend-exclude = ['*.ipynb']

[tool.ruff.lint]
select = ['F', 'E722']
# 157 unused local variables: removing them is not always side-effect free,
# so they are cleaned up separately before this rule is enabled.
ignore = ['F841']

[tool.ruff.lint.per-file-ignores]
# the package namespace re-exports the public API
'**/__init__.py' = ['F401']
