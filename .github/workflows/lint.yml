# Lint with ruff; the rules are in pyproject.toml ([tool.ruff]).
# Locally: `ruff check .` or `pre-commit run --all-files`.

name: Lint

on:
  push:
    branches-ignore: [master] # already verified in the PR
    tags-ignore: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # keep in sync with .pre-commit-config.yaml
      - name: Install ruff
        run: python -m pip install ruff==0.16.9

      - name: Run ruff
        run: ruff check --output-format=github .
