# Builds a Python package and publish it to PyPI when a new tag is
# created.

name: Publish to PyPI

on:
  # Runs on creating a new tag starting with 'v', e.g. 'v1.0.3'
  push:
    tags: ['**']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts the short-lived OIDC token of this job
    # instead of a stored API token. The publisher on PyPI is registered for
    # this workflow file and the `pypi` environment.
    environment:
      name: pypi
      url: https://pypi.org/project/cryspy/
    permissions:
      id-token: write

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Upgrade package installer for Python
        run: pip install --upgrade pip

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Create Python package
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
