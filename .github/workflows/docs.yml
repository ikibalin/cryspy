# Build the documentation (MkDocs) on every PR and push; publish it to
# GitHub Pages from master, i.e. for each release, or by hand.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [develop, master]
    tags-ignore: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags for versioningit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cryspy and the documentation tools
        run: python -m pip install -e . -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --site-dir site

      - name: Upload the site
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
